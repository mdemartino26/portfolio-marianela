[build]
  command = "npm run build"
  publish = "dist"

# Estas variables VITE_* quedan dentro del sitio compilado a propósito: son credenciales
# públicas de cliente (Firebase web, Cloudinary unsigned). La seguridad real está en las
# reglas de Firestore. Sin esto, el escáner de secretos de Netlify frena el deploy.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_CLOUDINARY_CLOUD_NAME,VITE_CLOUDINARY_UPLOAD_PRESET,VITE_FORMSPREE_ENDPOINT"
